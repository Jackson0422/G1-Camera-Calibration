# The operator's original 40 waist calibration poses, executed in this order.
# Angles are waist joint targets in degrees relative to SONIC's default standing
# posture: [yaw, roll, pitch]. Every pose is held while one camera frame is taken
# at the end of the hold. On hardware SONIC tracks yaw and roll but barely moves
# waist pitch (measured -0.5..+1.5 deg for +-15 deg references).
units: deg
order: [yaw, roll, pitch]
hold_s: 2.0
poses:
  - [0, 0, 0]
  - [-10, 0, 0]
  - [-20, 0, 0]
  - [-20, -10, 0]
  - [-20, -10, -10]
  - [-20, 0, -10]
  - [-20, 10, -10]
  - [-20, 10, 0]
  - [-20, 10, 10]
  - [-20, 0, 10]
  - [-20, -10, 10]
  - [-10, -10, 10]
  - [-10, -10, 0]
  - [0, -10, 0]
  - [0, -10, -10]
  - [10, -10, -10]
  - [10, -10, 0]
  - [10, 0, 0]
  - [10, 0, -10]
  - [0, 0, -10]
  - [-10, 0, -10]
  - [-10, 10, -10]
  - [-10, 10, 0]
  - [0, 10, 0]
  - [0, 10, -10]
  - [10, 10, 0]
  - [20, 10, 0]
  - [20, 10, -10]
  - [20, 0, -10]
  - [20, -10, -10]
  - [20, -10, 0]
  - [20, -10, 10]
  - [20, 0, 10]
  - [10, 0, 10]
  - [0, 0, 10]
  - [-10, 0, 10]
  - [0, -10, 10]
  - [0, 10, 10]
  - [20, 10, 10]
  - [20, 0, 0]
