urdf: g1_29dof.urdf
base_frame: left_ankle_roll_link
mount_frame: torso_link
# Operator requested advisory MuJoCo self-collisions for this calibration profile.
# Limits, floor checks, feedback monitoring and the complete preview still apply.
self_collision_check: 'off'
# Latest operator direction: use the robot's native joint-position servos;
# automatic whole-body balance is not requested. This is not a balance claim.
control_strategy: native_joint_position
automatic_balance_requested: false
native_position_entry_authorized: true
native_position_control_evidence: Operator clarified on 2026-11-12 that automatic balance is not required for the requested small upper-body motion and requested the robot's native joint position servos. Restore all 29 saved standing targets, then keep the 26 non-waist targets fixed and execute the original 40 waist targets. This authorizes the position-control workflow, not a claim that physical standing or target arrival has been verified.
native_position_transport: legacy_exclusive
native_position_factory_controller: ai
native_position_transport_evidence: Real run automatic_run_20261112T114958_927065Z received API-not-implemented code 3203 for SwitchToUserCtrl and remained in actual FSM 0. Read-only CheckMode receipt read_only_owner_20261112T115336_533624Z identified the existing controller as ai. This profile therefore uses exclusive rt/lowcmd ownership after a successful ReleaseMode reply and a fresh empty-owner observation; it never substitutes an invented UserCtrl FSM. Return to ai is separately verified and is not an atomic controller handover guarantee.
# FSM 500 is the installed SDK's named Start state. Admission and return must
# still receive fresh successful FSM observations; this is not firmware proof.
native_position_factory_fsm_ids: [500]
# Generic newer-UserCtrl admission; legacy_exclusive uses the separate IDs below.
native_position_initial_fsm_ids: [0, 1, 500]
# Admit the observed damping FSM1 directly without commanding zero torque first.
# This is entry policy, not proof of load continuity or standing balance.
legacy_position_initial_fsm_ids: [0, 1]
# The latest requirement supersedes the earlier fixture-bearing trial.
# Both feet carry the robot; the shoulder harness only catches a fall.
support_mode: feet
support_fixture_role: emergency_backup
support_requirement_evidence: Operator clarified on 2026-11-12 that the controller must assume no load-bearing fixture. The shoulder harness only prevents falls. Restore the saved 29-joint standing posture from another upright double-support posture; sitting, single-support and floor get-up are outside this requested recovery scope.
stability_required_phases: [full_body_entry, waist_motion, sampling]
post_run_standing_is_acceptance_criterion: false
stability_scope_evidence: Operator clarified on 2026-11-12 that stability is required during execution; indefinite standing after the run is not part of the acceptance requirement.
external_support_confirmed: false
external_support_evidence: Latest instruction on 2026-11-12 requires support through both feet. The operator clarified that the shoulder harness cannot carry the full robot weight and the feet always carry part of the load. The controller must not depend on the harness for normal standing or full-weight support during takeover or release.
fixture_can_carry_full_weight: false
standing_entry_scope: upright_double_support
standing_entry_scope_evidence: Operator explicitly selected "still standing with both feet on the ground; joint angles may differ" on 2026-11-12.
first_pose_entry_authorized: true
first_pose_entry_evidence: Operator requested on 2026-11-12 that full-body movement restore all 29 saved standing angles first, then hold every non-waist target at that saved reference while changing only the waist for calibration. This supersedes entry with non-waist targets frozen at the startup posture.
joint_deviation_check_evidence: Operator explicitly requested on 2026-11-12 that startup and ongoing motion must not abort for joint-angle deviation from the initial posture or previous command. Check actual target arrival only after each motion segment finishes, before recording. The accepted arrival and sampling accuracy criteria remain unchanged.
# Requested initialization target; a saved angle vector does not provide balance.
default_pose_file: default_standing_pose.yaml
default_pose_role: initialization_target
mount_attachment_evidence: null
sdk_source: /home/kaixin/unitree_sdk2_python
