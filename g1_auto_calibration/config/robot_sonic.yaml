# Legacy raw-velocity/range settings remain for older sessions. This standing
# workflow uses URDF mount-pose variation with the operator-approved accuracy
# budget instead; these values are not URDF mechanical limits.
max_joint_speed_rad_s: 0.015
max_joint_range_rad: 0.005
sampling_stability:
  method: urdf_mount_pose
  translation_limit_m: 0.005
  rotation_limit_deg: 0.5
  criteria_source: Operator accepted the existing calibration quality targets on 2026-11-11 (translation RMS 5 mm, rotation RMS 0.5 deg, validation reprojection 2 px). Sampling uses conservative mount-motion diameter bounds within the accepted pose budget; independent final validation remains required.
base_fixed_evidence: User confirmed on 2026-11-11 that both feet remain planted without
  lifting, turning or displacement throughout this standing-only calibration; left
  foot link is the reference. Common foot slip cannot be inferred from joint state.
board_stationary_evidence: User confirmed on 2026-11-11 that the physical calibration
  panel remains fixed throughout the session and is visible in the D435 field of view.
stance_monitor:
  enabled: true
  other_foot_frame: right_ankle_roll_link
  translation_limit_m: 0.005
  rotation_limit_deg: 1.0
  common_foot_slip_observable: false
